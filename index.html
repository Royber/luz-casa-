<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Luz en Casa</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Estilo visual del indicador con bombillo */
        .status-box {
            text-align: center;
            padding: 24px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .bulb-icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .status-up {
            background-color: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.4);
            color: var(--accent-green);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
        }

        .status-down {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Monitor de Energía</h1>

        <!-- Estado Visual con Bombillo -->
        <div class="card">
            <div id="statusBox" class="status-box status-up">
                <span id="bulbIcon" class="bulb-icon">💡</span>
                <div id="statusText" class="status-text">HAY LUZ EN CASA</div>
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-label" id="currentDurationLabel">Estado de la luz</div>
                    <div class="stat-value" id="currentDuration">Calculando...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Último corte registrado</div>
                    <div class="stat-value" id="lastOutage">Analizando historial...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://monitor-luz-casa.royber-seijas.workers.dev";
        const EXPECTED_PING_INTERVAL_MINUTES = 6; 

        let blackoutStartDate = null; 
        let isCurrentlyUp = true;

        function formatDuration(ms) {
            const totalMinutes = Math.floor(ms / (1000 * 60));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            if (hours === 0) return `${minutes} minuto(s)`;
            return `${hours} hora(s) y ${minutes} minuto(s)`;
        }

        async function fetchMonitorData() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) throw new Error("Error al conectar con el servidor");
                
                const data = await response.json();
                processDashboard(data);
            } catch (error) {
                const statusBox = document.getElementById('statusBox');
                statusBox.className = 'status-box status-down';
                document.getElementById('bulbIcon').innerText = '🔌';
                document.getElementById('statusText').innerText = 'ERROR DE CONEXIÓN';
                console.error(error);
            }
        }

        function processDashboard(data) {
            const statusBox = document.getElementById('statusBox');
            const bulbIcon = document.getElementById('bulbIcon');
            const statusText = document.getElementById('statusText');
            const currentDurationLabel = document.getElementById('currentDurationLabel');
            const currentDurationEl = document.getElementById('currentDuration');
            const lastOutageEl = document.getElementById('lastOutage');

            const pings = data.pings || [];
            isCurrentlyUp = data.status === 'up';
            
            if (isCurrentlyUp) {
                statusBox.className = 'status-box status-up';
                bulbIcon.innerText = '💡';
                statusText.innerText = 'HAY LUZ EN CASA';
            } else {
                statusBox.className = 'status-box status-down';
                bulbIcon.innerText = '❌';
                statusText.innerText = 'SIN LUZ (APAGÓN)';
            }

            if (pings.length > 0) {
                const sortedPings = [...pings].sort((a, b) => new Date(a.date) - new Date(b.date));

                if (isCurrentlyUp) {
                    currentDurationLabel.innerText = "Estado actual";
                    currentDurationEl.innerText = "Luz establecida";
                    blackoutStartDate = null; 
                } else {
                    currentDurationLabel.innerText = "Tiempo que lleva el apagón";
                    blackoutStartDate = new Date(sortedPings[sortedPings.length - 1].date);
                    updateLiveTimer();
                }

                // --- CALCULO DEL ÚLTIMO CORTE ---
                let foundOutage = false;
                for (let i = sortedPings.length - 1; i > 0; i--) {
                    const current = new Date(sortedPings[i].date);
                    const previous = new Date(sortedPings[i-1].date);
                    const gapMinutes = (current - previous) / (1000 * 60);

                    if (gapMinutes > EXPECTED_PING_INTERVAL_MINUTES) {
                        const outageStart = previous.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
                        lastOutageEl.innerText = `${outageStart} (Duró ${formatDuration(gapMinutes * 60 * 1000)})`;
                        foundOutage = true;
                        break;
                    }
                }

                if (!foundOutage) {
                    lastOutageEl.innerText = "Ningún corte reciente registrado";
                }
            } else {
                currentDurationEl.innerText = "Sin datos";
                lastOutageEl.innerText = "Sin registros";
            }
        }

        // Actualiza el contador del apagón segundo a segundo solo si estamos sin luz
        function updateLiveTimer() {
            if (isCurrentlyUp || !blackoutStartDate) return;
            const now = new Date();
            const diffMs = now - blackoutStartDate;
            document.getElementById('currentDuration').innerText = formatDuration(Math.max(0, diffMs));
        }

        // Cargar al abrir y actualizar datos desde el servidor cada 60 segundos
        fetchMonitorData();
        setInterval(fetchMonitorData, 60000);

        // Refrescar el reloj visual cada 1 segundo (solo activo durante apagones)
        setInterval(updateLiveTimer, 1000);
    </script>
</body>
</html>
