<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Luz en Casa</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-box {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .status-up {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-down {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Monitor de Energía</h1>

        <!-- Estado Actual -->
        <div class="card">
            <div id="statusBox" class="status-box status-up">
                Cargando estado...
            </div>

            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-label" id="currentDurationLabel">Tiempo en el estado actual</div>
                    <div class="stat-value" id="currentDuration">Calculando...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Último corte registrado</div>
                    <div class="stat-value" id="lastOutage">Analizando historial...</div>
                </div>
            </div>
        </div>

        <!-- Historial de Latidos -->
        <div class="card">
            <h2>Últimos Registros</h2>
            <ul id="logList">
                <li>Cargando registros...</li>
            </ul>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE CLOUDFLARE WORKER
        const WORKER_URL = "https://monitor-luz-casa.royber-seijas.workers.dev";

        // Asumimos que tu ESP32 manda un ping cada X minutos (ej. cada 5 min). 
        // Si pasan más de este margen sin ping, se asume que se fue la luz.
        const EXPECTED_PING_INTERVAL_MINUTES = 6; 

        function formatDuration(ms) {
            const totalMinutes = Math.floor(ms / (1000 * 60));
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            if (hours === 0) return `${minutes} minuto(s)`;
            return `${hours} hora(s) y ${minutes} minuto(s)`;
        }

        async function fetchMonitorData() {
            try {
                const response = await fetch(WORKER_URL);
                if (!response.ok) throw new Error("Error al conectar con el servidor");
                
                const data = await response.json();
                processDashboard(data);
            } catch (error) {
                document.getElementById('statusBox').className = 'status-box status-down';
                document.getElementById('statusBox').innerText = 'Error de Conexión';
                console.error(error);
            }
        }

        function processDashboard(data) {
            const statusBox = document.getElementById('statusBox');
            const currentDurationEl = document.getElementById('currentDuration');
            const currentDurationLabel = document.getElementById('currentDurationLabel');
            const lastOutageEl = document.getElementById('lastOutage');
            const logList = document.getElementById('logList');

            const pings = data.pings || [];
            
            // 1. Mostrar estado actual básico
            const isUp = data.status === 'up';
            statusBox.className = `status-box ${isUp ? 'status-up' : 'status-down'}`;
            statusBox.innerText = isUp ? 'HAY LUZ EN CASA ⚡' : 'SIN LUZ (APAGÓN) ❌';

            const now = new Date();

            if (pings.length > 0) {
                // Ordenar pings del más antiguo al más reciente para analizar la línea de tiempo
                const sortedPings = [...pings].sort((a, b) => new Date(a.date) - new Date(b.date));
                const lastPingTime = new Date(sortedPings[sortedPings.length - 1].date);

                // --- CALCULO 1: Tiempo en el estado actual ---
                if (isUp) {
                    currentDurationLabel.innerText = "Tiempo con luz continua";
                    // Desde el último ping recibido hasta ahora
                    const diffMs = now - lastPingTime;
                    currentDurationEl.innerText = formatDuration(Math.max(0, diffMs));
                } else {
                    currentDurationLabel.innerText = "Tiempo que lleva el apagón";
                    const diffMs = now - lastPingTime;
                    currentDurationEl.innerText = formatDuration(Math.max(0, diffMs));
                }

                // --- CALCULO 2: Buscar el último corte (gap entre pings) ---
                let foundOutage = false;
                for (let i = sortedPings.length - 1; i > 0; i--) {
                    const current = new Date(sortedPings[i].date);
                    const previous = new Date(sortedPings[i-1].date);
                    const gapMinutes = (current - previous) / (1000 * 60);

                    // Si la brecha entre dos pings es mayor al intervalo esperado, hubo un corte ahí
                    if (gapMinutes > EXPECTED_PING_INTERVAL_MINUTES) {
                        const outageDuration = gapMinutes;
                        const outageStart = previous.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
                        lastOutageEl.innerText = `${outageStart} (Duró ${formatDuration(outageDuration * 60 * 1000)})`;
                        foundOutage = true;
                        break;
                    }
                }

                if (!foundOutage) {
                    lastOutageEl.innerText = "Ningún corte reciente registrado";
                }

                // --- LLENAR LISTA DE REGISTROS ---
                logList.innerHTML = '';
                sortedPings.reverse().slice(0, 10).forEach(ping => {
                    const fecha = new Date(ping.date).toLocaleString([], { dateStyle: 'short', timeStyle: 'medium' });
                    const item = document.createElement('li');
                    item.innerHTML = `<span>${fecha}</span> <span>Latido OK</span>`;
                    logList.appendChild(item);
                });

            } else {
                currentDurationEl.innerText = "Sin datos";
                lastOutageEl.innerText = "Sin registros";
                logList.innerHTML = '<li>No hay registros recientes.</li>';
            }
        }

        // Cargar al abrir y actualizar cada 60 segundos
        fetchMonitorData();
        setInterval(fetchMonitorData, 60000);
    </script>
</body>
</html>
